<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture projetée — Troupe 122</title>
<style>
  /* ------------------------------------------------------------
     Écran de préparation (§6 de ARCHITECTURE.md) : import, attribution
     personnage → slot, reprise de session.
     ------------------------------------------------------------ */
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #111; }
  #ecran-preparation { padding: 2rem; max-width: 60rem; }
  #ecran-preparation section { margin-bottom: 1.6rem; }
  #ecran-preparation table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  #ecran-preparation th, #ecran-preparation td {
    border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left;
  }
  #ecran-preparation .swatch {
    display: inline-block; width: 0.9em; height: 0.9em; border-radius: 50%;
    margin-right: 0.4em; vertical-align: middle;
  }
  .message-erreur {
    color: #7a0010; background: #fdeaea; border: 1px solid #7a0010;
    padding: 0.6rem 0.9rem; border-radius: 0.3rem; font-weight: bold;
  }
  .message-bandeau {
    color: #6b4b00; background: #fff6dd; border: 1px solid #d1a300;
    padding: 0.6rem 0.9rem; border-radius: 0.3rem;
  }
  #bouton-demarrer:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ------------------------------------------------------------
     Rendu projeté (§8 de ARCHITECTURE.md). Une diapo par élément de
     la liste plate, montées une fois, une seule visible à la fois
     via .actif (§8.1) — jamais de re-rendu au changement de position.
     ------------------------------------------------------------ */
  :root {
    --fond-projection: #0b0b0e;
    --texte-clair: #f5f5f5;
    --attenue: #9a9a9a;
  }

  #ecran-projection {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: var(--fond-projection);
    color: var(--texte-clair);
    font-family: Georgia, 'Times New Roman', serif;
  }

  #ecran-projection.visible { display: flex; }

  #contenu-projection { flex: 1; position: relative; }

  .diapo {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 4vw 8vw;
    text-align: center;
  }

  .diapo.actif { display: flex; }

  .diapo.kind-scene {
    font-size: 3.6vw;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--attenue);
  }

  .diapo.kind-lieu,
  .diapo.kind-didascalie {
    font-style: italic;
    color: var(--attenue);
    font-size: 2.6vw;
    max-width: 80%;
  }

  .diapo.kind-texte-sans-personnage {
    font-size: 2.4vw;
    color: #e0c341;
    border: 0.15vw dashed #e0c341;
    padding: 2vw 4vw;
    border-radius: 0.6vw;
    max-width: 80%;
  }

  .diapo.kind-texte-sans-personnage::before {
    content: 'texte non attribué';
    display: block;
    font-size: 0.5em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6em;
  }

  .diapo.kind-replique .qui {
    font-size: 1.8vw;
    font-weight: bold;
    padding: 0.3em 0.9em;
    border-radius: 999px;
    margin-bottom: 0.6em;
  }

  .diapo.kind-replique .personnage {
    font-size: 1.3vw;
    color: var(--attenue);
    margin-bottom: 0.8em;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .diapo.kind-replique .texte {
    font-size: 4.2vw;
    line-height: 1.35;
    max-width: 90%;
    border-left: 0.4vw solid var(--couleur, #555);
    padding-left: 1.2vw;
  }

  .didascalie-interne {
    font-style: italic;
    color: var(--attenue);
    font-size: 0.55em;
    padding: 0 0.3em;
  }

  #barre-progression {
    flex: none;
    padding: 0.6vw 1.4vw;
    font-size: 0.9vw;
    color: var(--attenue);
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div id="ecran-preparation">
  <h1>Lecture projetée — préparation</h1>

  <section id="section-reprise" hidden>
    <p class="message-bandeau" id="message-reprise"></p>
    <button id="bouton-reprendre" type="button">Reprendre la lecture</button>
  </section>

  <section id="section-bandeau-stockage"></section>

  <section id="section-import">
    <h2>1. Charger la pièce</h2>
    <p>
      <label for="import-fichier">Fichier <code>REPET.json</code> (produit par
      <code>outil_edition</code>) :</label><br>
      <input type="file" id="import-fichier" accept="application/json,.json">
    </p>
    <p id="erreur-import" class="message-erreur" hidden></p>
  </section>

  <section id="section-attribution" hidden>
    <h2>2. Attribuer les personnages aux lecteurs</h2>
    <p>
      Un lecteur (slot) peut jouer plusieurs personnages : plusieurs menus
      peuvent pointer vers le même slot. Aucune valeur n'est devinée.
    </p>
    <table>
      <thead>
        <tr><th>Personnage</th><th>Répliques</th><th>Slot</th><th>Aperçu</th></tr>
      </thead>
      <tbody id="corps-attribution"></tbody>
    </table>
    <p id="erreur-attribution" class="message-erreur" hidden></p>
    <button id="bouton-demarrer" type="button" disabled>Démarrer la lecture</button>
  </section>
</div>

<div id="ecran-projection">
  <div id="contenu-projection"></div>
  <div id="barre-progression">
    <span id="progression-scene"></span>
    <span id="progression-position"></span>
  </div>
</div>

<script>
// ============================================================
// 1. CONFIG — constantes, aucune logique
// ============================================================

const CONFIG = Object.freeze({
  /** Version de schéma acceptée pour un REPET.json. Toute autre est refusée. */
  SCHEMA_ACCEPTE: 'repetition/1',

  /** Les dix slots possibles, dans l'ordre d'affichage de la fenêtre de contrôle. */
  SLOTS: Object.freeze(['H1', 'H2', 'H3', 'H4', 'H5', 'F1', 'F2', 'F3', 'F4', 'F5']),

  /**
   * Une couleur par slot, fixe, indépendante du prénom qui l'occupe (§8.2 de
   * ARCHITECTURE.md). Choisies pour un fort contraste en salle éclairée,
   * jamais de pastel : palette dérivée du jeu de 20 couleurs de
   * Sasha Trubetskoy, conçu justement pour rester distinguable en conditions
   * dégradées.
   */
  COULEURS_SLOT: Object.freeze({
    H1: '#e6194b', // rouge
    H2: '#3cb44b', // vert
    H3: '#4363d8', // bleu
    H4: '#f58231', // orange
    H5: '#911eb4', // violet
    F1: '#42d4f4', // cyan
    F2: '#f032e6', // magenta
    F3: '#ffe119', // jaune
    F4: '#469990', // sarcelle
    F5: '#9a6324', // brun
  }),

  /** Préfixe de toutes les clés localStorage de cet outil. */
  PREFIXE_STOCKAGE: 'lecture:v1',

  /** Délai avant écriture différée dans localStorage (session, prénoms). */
  DELAI_ECRITURE_MS: 500,

  /** Nom du canal BroadcastChannel entre projection et contrôle. */
  CANAL_SYNCHRO: 'lecture:v1',
});

// ============================================================
// 2. VALIDATION — valider un REPET.json importé, refuser tôt (§11)
// ============================================================

/** Types d'élément reconnus dans les `elements` d'une unité jouable. */
const TYPES_ELEMENT_CONNUS = Object.freeze([
  'replique',
  'didascalie',
  'lieu',
  'texte_sans_personnage',
]);

/**
 * Valide un objet issu de `JSON.parse`.
 *
 * Réécriture volontairement autonome de `outil_repetition/js/schema.js`
 * (même esprit : refuser avant tout affichage, nommer le champ fautif) —
 * voir §4.1 de ARCHITECTURE.md sur la raison de ne pas l'importer.
 *
 * @param {unknown} donnees
 * @returns {{valide: true, piece: object} | {valide: false, erreur: string}}
 */
function validerRepet(donnees) {
  if (donnees === null || typeof donnees !== 'object' || Array.isArray(donnees)) {
    return _refusValidation('le fichier ne contient pas un objet JSON.');
  }

  if (donnees.schema !== CONFIG.SCHEMA_ACCEPTE) {
    return _refusValidation(
      `schéma « ${donnees.schema ?? 'absent'} » non reconnu — cette page ` +
      `attend « ${CONFIG.SCHEMA_ACCEPTE} ». Régénérez le fichier avec la ` +
      'version correspondante d’outil_edition.'
    );
  }

  if (typeof donnees.piece !== 'string' || donnees.piece.trim() === '') {
    return _refusValidation('le champ « piece » est absent ou vide.');
  }

  if (!Array.isArray(donnees.unites) || donnees.unites.length === 0) {
    return _refusValidation('le champ « unites » est absent ou vide : aucun texte à lire.');
  }

  if (!Array.isArray(donnees.personnages) || donnees.personnages.length === 0) {
    return _refusValidation('le champ « personnages » est absent ou vide.');
  }

  for (let i = 0; i < donnees.unites.length; i += 1) {
    const erreur = _validerUnite(donnees.unites[i], i);

    if (erreur) {
      return _refusValidation(erreur);
    }
  }

  return { valide: true, piece: donnees };
}

function _validerUnite(unite, position) {
  const ou = `unité ${position + 1}`;

  if (unite === null || typeof unite !== 'object' || Array.isArray(unite)) {
    return `${ou} : ce n’est pas un objet.`;
  }

  if (typeof unite.id !== 'string' || unite.id === '') {
    return `${ou} : champ « id » absent.`;
  }

  if (!Array.isArray(unite.elements)) {
    return `${ou} (${unite.id}) : champ « elements » absent.`;
  }

  for (let i = 0; i < unite.elements.length; i += 1) {
    const erreur = _validerElement(unite.elements[i], `${ou} (${unite.id})`, i);

    if (erreur) {
      return erreur;
    }
  }

  return null;
}

function _validerElement(element, ou, position) {
  const situe = `${ou}, élément ${position + 1}`;

  if (element === null || typeof element !== 'object' || Array.isArray(element)) {
    return `${situe} : ce n’est pas un objet.`;
  }

  if (typeof element.type !== 'string') {
    return `${situe} : champ « type » absent.`;
  }

  if (!TYPES_ELEMENT_CONNUS.includes(element.type)) {
    return `${situe} : type « ${element.type} » inconnu.`;
  }

  if (element.type !== 'replique') {
    return typeof element.texte === 'string' ? null : `${situe} : champ « texte » absent.`;
  }

  for (const champ of ['id', 'personnage', 'texte']) {
    if (typeof element[champ] !== 'string' || element[champ] === '') {
      return `${situe} : réplique sans « ${champ} ».`;
    }
  }

  return null;
}

function _refusValidation(erreur) {
  return { valide: false, erreur };
}

// ============================================================
// 3. MODELE — index dérivé du REPET.json, pur, sans effet de bord
// ============================================================

/**
 * Aplatit `piece.unites[].elements[]` en une liste plate, unité de
 * navigation et de rendu (§5 de ARCHITECTURE.md).
 *
 * @param {object} piece
 * @returns {object[]}
 */
function aplatirEnElements(piece) {
  const elements = [];

  for (const unite of piece.unites) {
    if (!unite.implicite) {
      elements.push({
        kind: 'scene',
        uniteId: unite.id,
        acte: unite.acte ?? null,
        scene: unite.scene ?? null,
      });
    }

    for (const el of unite.elements) {
      elements.push(_elementAplati(el, unite.id));
    }
  }

  return elements;
}

function _elementAplati(el, uniteId) {
  if (el.type === 'replique') {
    return {
      kind: 'replique',
      uniteId,
      id: el.id,
      personnage: el.personnage,
      texte: el.texte,
      vers: Boolean(el.vers),
      didascaliesInternes: el.didascalies_internes ?? [],
    };
  }

  // 'didascalie', 'lieu', 'texte_sans_personnage' : même forme minimale.
  return { kind: el.type, uniteId, texte: el.texte };
}

/**
 * Sommaire des scènes, dérivé de la liste plate : `[{ uniteId, acte, scene,
 * position }]`. Sert à retrouver « scène courante » par recherche de la
 * dernière entrée dont la position ne dépasse pas la position lue.
 *
 * @param {object[]} elements résultat de `aplatirEnElements`
 */
function calculerSommaire(elements) {
  const sommaire = [];

  elements.forEach((el, position) => {
    if (el.kind === 'scene') {
      sommaire.push({ uniteId: el.uniteId, acte: el.acte, scene: el.scene, position });
    }
  });

  return sommaire;
}

/** Entrée du sommaire couvrant `position`, ou `null` avant la première scène. */
function scenePourPosition(sommaire, position) {
  let courante = null;

  for (const entree of sommaire) {
    if (entree.position > position) {
      break;
    }

    courante = entree;
  }

  return courante;
}

/**
 * Personnages de `piece.personnages` sans slot valide dans `cast`.
 *
 * @param {{nom: string}[]} personnages
 * @param {Record<string,string>} cast
 */
function personnagesSansSlot(personnages, cast) {
  return personnages
    .map((p) => p.nom)
    .filter((nom) => !CONFIG.SLOTS.includes(cast[nom]));
}

// ============================================================
// 4. ETAT — position courante et transitions, pur
// ============================================================

function creerEtatInitial() {
  return {
    position: 0,
    cast: {},     // { PERSONNAGE: 'H1', … }
    prenoms: {},  // { H1: 'Émile', … }
  };
}

/** Déplace la position, bornée à `[0, longueur - 1]`. */
function irA(etat, nouvellePosition, longueur) {
  const bornee = Math.max(0, Math.min(nouvellePosition, Math.max(longueur - 1, 0)));
  return { ...etat, position: bornee };
}

function suivant(etat, longueur) {
  return irA(etat, etat.position + 1, longueur);
}

function precedent(etat, longueur) {
  return irA(etat, etat.position - 1, longueur);
}

// ============================================================
// 5. STOCKAGE — localStorage, aucune écriture silencieusement avalée (§11)
// ============================================================

function cleStockage(suffixe) {
  return `${CONFIG.PREFIXE_STOCKAGE}:${suffixe}`;
}

/**
 * Identifiant de pièce dérivé de son nom (§10.1 et §13 point 1 de
 * ARCHITECTURE.md : risque de collision accepté, pas de hachage de contenu).
 */
function pieceSlug(nomPiece) {
  return nomPiece
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // diacritiques deposees par NFD
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'piece';
}

/**
 * Écrit dans localStorage, sans jamais avaler une erreur (P3) : l'appelant
 * reçoit `{ ok: false, erreur }` et décide de l'affichage (bandeau, §11).
 */
function ecrireStockage(cle, valeur) {
  try {
    localStorage.setItem(cle, JSON.stringify(valeur));
    return { ok: true };
  } catch (erreur) {
    return { ok: false, erreur: String(erreur && erreur.message || erreur) };
  }
}

function lireStockage(cle) {
  try {
    const brut = localStorage.getItem(cle);
    return { ok: true, valeur: brut === null ? null : JSON.parse(brut) };
  } catch (erreur) {
    return { ok: false, erreur: String(erreur && erreur.message || erreur) };
  }
}

// ============================================================
// 6. SYNCHRO — BroadcastChannel entre projection et contrôle.
//    Arrive à l'étape 5 (§7 de ARCHITECTURE.md). Rien ici pour l'instant :
//    la projection fonctionne seule (§9 « ce que la fenêtre de contrôle
//    affiche » ne s'applique pas encore).
// ============================================================

// ============================================================
// 7. RENDU PROJECTION — montage une fois, décoration par classe (§8)
// ============================================================

/** Libellé d'en-tête pour une transition de scène. */
function libelleScene(acte, scene) {
  return [acte, scene].filter(Boolean).join(' — ') || 'Scène';
}

/**
 * Couleur de texte lisible (noir ou blanc) sur un fond hexadécimal donné.
 * Évite de coder en dur une couleur de texte par slot : certains slots de
 * la palette (§12) sont clairs (jaune, cyan), d'autres sombres (brun,
 * sarcelle), et un texte noir fixe deviendrait illisible sur ces derniers.
 */
function couleurTexteContrastee(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

  return luminance > 0.6 ? '#111111' : '#ffffff';
}

/**
 * Découpe le texte d'une réplique en segments ordonnés, en insérant les
 * didascalies internes au bon rang de mot (§2.1 de ARCHITECTURE.md et
 * `repet_export.py:separer_parole_et_jeu`, dont `avant_mot` reprend ici
 * exactement la même définition : un rang de mot obtenu en découpant sur
 * les espaces). Les retours à la ligne (vers) sont préservés comme
 * segments `saut`, jamais recollés.
 *
 * @param {string} texte
 * @param {{avant_mot: number, texte: string}[]} didascaliesInternes
 * @returns {{type: 'mot'|'didascalie'|'saut', texte?: string}[]}
 */
function segmenterAvecDidascalies(texte, didascaliesInternes) {
  const parRang = new Map();

  for (const d of didascaliesInternes || []) {
    if (!parRang.has(d.avant_mot)) {
      parRang.set(d.avant_mot, []);
    }

    parRang.get(d.avant_mot).push(d.texte);
  }

  const segments = [];
  let rangMot = 0;

  const inserer = (rang) => {
    if (!parRang.has(rang)) {
      return;
    }

    for (const texteDidascalie of parRang.get(rang)) {
      segments.push({ type: 'didascalie', texte: texteDidascalie });
    }
  };

  texte.split('\n').forEach((ligne, indexLigne) => {
    if (indexLigne > 0) {
      segments.push({ type: 'saut' });
    }

    for (const mot of ligne.split(/\s+/).filter(Boolean)) {
      inserer(rangMot);
      segments.push({ type: 'mot', texte: mot });
      rangMot += 1;
    }
  });

  inserer(rangMot);

  return segments;
}

function _construireDiapoScene(el) {
  const diapo = document.createElement('div');
  diapo.className = 'diapo kind-scene';
  diapo.textContent = libelleScene(el.acte, el.scene);
  return diapo;
}

function _construireDiapoSimple(el, classeCss) {
  const diapo = document.createElement('div');
  diapo.className = `diapo ${classeCss}`;
  diapo.textContent = el.texte;
  return diapo;
}

function _construireDiapoReplique(el, cast, prenoms) {
  const slot = cast[el.personnage] || null;
  const couleur = slot ? CONFIG.COULEURS_SLOT[slot] : '#555555';

  const diapo = document.createElement('div');
  diapo.className = 'diapo kind-replique';
  diapo.dataset.slot = slot || '';
  diapo.style.setProperty('--couleur', couleur);

  const qui = document.createElement('div');
  qui.className = 'qui';
  // Un champ prénom vide retombe sur le nom brut du slot (§7.3) — jamais
  // une chaîne vide affichée à la place d'un nom.
  qui.textContent = (slot && prenoms[slot]) || slot || '?';
  qui.style.background = couleur;
  qui.style.color = couleurTexteContrastee(couleur);
  diapo.appendChild(qui);

  const perso = document.createElement('div');
  perso.className = 'personnage';
  perso.textContent = el.personnage;
  diapo.appendChild(perso);

  const texte = document.createElement('div');
  texte.className = el.vers ? 'texte vers' : 'texte';

  for (const segment of segmenterAvecDidascalies(el.texte, el.didascaliesInternes)) {
    if (segment.type === 'saut') {
      texte.appendChild(document.createElement('br'));
      continue;
    }

    if (segment.type === 'didascalie') {
      const span = document.createElement('span');
      span.className = 'didascalie-interne';
      span.textContent = segment.texte;
      texte.appendChild(span);
      continue;
    }

    texte.appendChild(document.createTextNode(`${segment.texte} `));
  }

  diapo.appendChild(texte);
  return diapo;
}

/** Construit une diapo par élément de la liste plate, non montées. */
function construireDiapos(elements, cast, prenoms) {
  return elements.map((el, index) => {
    let diapo;

    if (el.kind === 'scene') {
      diapo = _construireDiapoScene(el);
    } else if (el.kind === 'lieu') {
      diapo = _construireDiapoSimple(el, 'kind-lieu');
    } else if (el.kind === 'didascalie') {
      diapo = _construireDiapoSimple(el, 'kind-didascalie');
    } else if (el.kind === 'texte_sans_personnage') {
      diapo = _construireDiapoSimple(el, 'kind-texte-sans-personnage');
    } else {
      diapo = _construireDiapoReplique(el, cast, prenoms);
    }

    diapo.dataset.index = String(index);
    return diapo;
  });
}

/** Monte toutes les diapos une fois dans `container` (§8.1). */
function monterProjection(container, elements, cast, prenoms) {
  container.innerHTML = '';
  const diapos = construireDiapos(elements, cast, prenoms);

  for (const diapo of diapos) {
    container.appendChild(diapo);
  }

  return diapos;
}

/**
 * Met à jour l'étiquette de tous les slots affichés, sans reconstruire le
 * DOM (§8.2) : appelée quand la fenêtre de contrôle diffuse de nouveaux
 * prénoms (§7.2, câblée à l'étape 5).
 */
function mettreAJourPrenoms(container, prenoms) {
  for (const slot of CONFIG.SLOTS) {
    const label = (prenoms && prenoms[slot]) || slot;

    container.querySelectorAll(`[data-slot="${slot}"] .qui`).forEach((qui) => {
      qui.textContent = label;
    });
  }
}

/** Change l'élément visible par une seule écriture de classe (§8.1). */
function afficherPosition(diapos, position) {
  diapos.forEach((diapo, index) => {
    diapo.classList.toggle('actif', index === position);
  });
}

function texteProgressionScene(sommaire, position) {
  const entree = scenePourPosition(sommaire, position);

  if (!entree) {
    return '—';
  }

  const rang = sommaire.indexOf(entree) + 1;
  return `${libelleScene(entree.acte, entree.scene)}  ·  scène ${rang}/${sommaire.length}`;
}

// ============================================================
// 8. RENDU CONTRÔLE — arrive à l'étape 5 (§7 de ARCHITECTURE.md).
// ============================================================

// ============================================================
// 9. RENDU PRÉPARATION — import et attribution personnage → slot (§6)
// ============================================================

/** Une ligne de la table d'attribution : personnage, volume, slot, aperçu. */
function construireLigneAttribution(personnage, slotActuel) {
  const tr = document.createElement('tr');
  tr.dataset.personnage = personnage.nom;

  const tdNom = document.createElement('td');
  tdNom.textContent = personnage.nom;
  tr.appendChild(tdNom);

  const tdRepliques = document.createElement('td');
  tdRepliques.textContent = String(personnage.repliques);
  tr.appendChild(tdRepliques);

  const tdSlot = document.createElement('td');
  const select = document.createElement('select');
  select.className = 'select-slot';

  const optionVide = document.createElement('option');
  optionVide.value = '';
  optionVide.textContent = '— choisir —';
  select.appendChild(optionVide);

  for (const slot of CONFIG.SLOTS) {
    const option = document.createElement('option');
    option.value = slot;
    option.textContent = slot;
    option.selected = slot === slotActuel;
    select.appendChild(option);
  }

  tdSlot.appendChild(select);
  tr.appendChild(tdSlot);

  const tdApercu = document.createElement('td');
  const swatch = document.createElement('span');
  swatch.className = 'swatch';
  tdApercu.appendChild(swatch);
  tr.appendChild(tdApercu);

  const rafraichirSwatch = () => {
    swatch.style.background = select.value ? CONFIG.COULEURS_SLOT[select.value] : '#ccc';
  };

  select.addEventListener('change', rafraichirSwatch);
  rafraichirSwatch();

  return tr;
}

/** (Re)construit la table d'attribution, pré-remplie depuis `castInitial`. */
function construireTableAttribution(corps, personnages, castInitial) {
  corps.innerHTML = '';

  for (const personnage of personnages) {
    corps.appendChild(construireLigneAttribution(personnage, castInitial[personnage.nom] || ''));
  }
}

/** Lit l'attribution courante depuis la table (§6 : uniquement les slots choisis). */
function lireCastDepuisTable(corps) {
  const cast = {};

  corps.querySelectorAll('tr').forEach((tr) => {
    const select = tr.querySelector('select');

    if (select.value) {
      cast[tr.dataset.personnage] = select.value;
    }
  });

  return cast;
}

// ============================================================
// 10. CABLAGE — import, attribution, démarrage, navigation, reprise (§9-10)
// ============================================================

(() => {
  let piece = null;
  let slug = null;
  let personnagesCourants = [];
  let diapos = [];
  let sommaire = [];
  let position = 0;
  let prenoms = {};
  let ecritureSessionEnAttente = null;

  const ecranPreparation = document.getElementById('ecran-preparation');
  const ecranProjection = document.getElementById('ecran-projection');
  const contenu = document.getElementById('contenu-projection');
  const progressionScene = document.getElementById('progression-scene');
  const progressionPosition = document.getElementById('progression-position');

  const importFichier = document.getElementById('import-fichier');
  const erreurImport = document.getElementById('erreur-import');
  const sectionAttribution = document.getElementById('section-attribution');
  const corpsAttribution = document.getElementById('corps-attribution');
  const erreurAttribution = document.getElementById('erreur-attribution');
  const boutonDemarrer = document.getElementById('bouton-demarrer');
  const sectionReprise = document.getElementById('section-reprise');
  const messageReprise = document.getElementById('message-reprise');
  const boutonReprendre = document.getElementById('bouton-reprendre');
  const sectionBandeauStockage = document.getElementById('section-bandeau-stockage');

  // --- stockage, jamais d'échec silencieux (§11) --------------------------

  let bandeauStockageAffiche = false;

  function signalerEchecStockage(erreur) {
    if (bandeauStockageAffiche) {
      return;
    }

    bandeauStockageAffiche = true;
    const p = document.createElement('p');
    p.className = 'message-bandeau';
    p.textContent =
      `Le stockage local est indisponible (${erreur}) : la pièce et ` +
      'l’attribution ne seront pas conservées d’une session à l’autre.';
    sectionBandeauStockage.appendChild(p);
  }

  function ecrire(cle, valeur) {
    const resultat = ecrireStockage(cle, valeur);

    if (!resultat.ok) {
      signalerEchecStockage(resultat.erreur);
    }

    return resultat.ok;
  }

  function lire(cle) {
    const resultat = lireStockage(cle);

    if (!resultat.ok) {
      signalerEchecStockage(resultat.erreur);
      return null;
    }

    return resultat.valeur;
  }

  prenoms = lire(cleStockage('prenoms')) || {};

  // --- projection ----------------------------------------------------------

  function rafraichirProgression() {
    progressionScene.textContent = texteProgressionScene(sommaire, position);
    progressionPosition.textContent = `${position + 1}/${diapos.length}`;
  }

  /** Écriture différée de la session (§10.2), pour ne pas écrire à chaque frappe. */
  function planifierEcritureSession() {
    if (ecritureSessionEnAttente) {
      clearTimeout(ecritureSessionEnAttente);
    }

    ecritureSessionEnAttente = setTimeout(() => {
      ecrire(cleStockage('session'), { pieceSlug: slug, position });
    }, CONFIG.DELAI_ECRITURE_MS);
  }

  function allerA(nouvellePosition) {
    position = irA({ position }, nouvellePosition, diapos.length).position;
    afficherPosition(diapos, position);
    rafraichirProgression();
    planifierEcritureSession();
  }

  function demarrerProjection(piecePreparee, cast, positionDepart) {
    piece = piecePreparee;
    slug = pieceSlug(piece.piece);

    const elements = aplatirEnElements(piece);
    sommaire = calculerSommaire(elements);
    diapos = monterProjection(contenu, elements, cast, prenoms);

    const bornee = typeof positionDepart === 'number' ? positionDepart : 0;
    position = irA({ position: 0 }, bornee, diapos.length).position;

    ecranPreparation.style.display = 'none';
    ecranProjection.classList.add('visible');

    afficherPosition(diapos, position);
    rafraichirProgression();
  }

  document.addEventListener('keydown', (evenement) => {
    if (!ecranProjection.classList.contains('visible')) {
      return;
    }

    if (evenement.key === 'ArrowRight') {
      allerA(position + 1);
    } else if (evenement.key === 'ArrowLeft') {
      allerA(position - 1);
    } else if (evenement.key === 'f' || evenement.key === 'F') {
      document.documentElement.requestFullscreen?.();
    }
  });

  // --- reprise de session (§13 point 3, validé : implémentée) -------------

  (function proposerReprise() {
    const session = lire(cleStockage('session'));

    if (!session || !session.pieceSlug) {
      return;
    }

    const pieceSauvegardee = lire(cleStockage(`piece:${session.pieceSlug}`));
    const castSauvegarde = lire(cleStockage(`cast:${session.pieceSlug}`));

    if (!pieceSauvegardee || !castSauvegarde) {
      return;
    }

    const resultat = validerRepet(pieceSauvegardee);

    if (!resultat.valide) {
      return; // donnée corrompue : jamais de reprise sur une pièce invalide
    }

    if (personnagesSansSlot(resultat.piece.personnages, castSauvegarde).length > 0) {
      return; // attribution incomplète : on repasse par l'écran normal
    }

    messageReprise.textContent = `« ${resultat.piece.piece} » — reprendre à la position sauvegardée.`;
    sectionReprise.hidden = false;

    boutonReprendre.addEventListener('click', () => {
      demarrerProjection(resultat.piece, castSauvegarde, session.position);
    });
  })();

  // --- import et attribution (§6) ------------------------------------------

  function rafraichirEtatDemarrage() {
    const cast = lireCastDepuisTable(corpsAttribution);
    const manquants = personnagesSansSlot(personnagesCourants, cast);

    if (manquants.length > 0) {
      erreurAttribution.hidden = false;
      erreurAttribution.textContent = `Personnages sans slot : ${manquants.join(', ')}.`;
      boutonDemarrer.disabled = true;
    } else {
      erreurAttribution.hidden = true;
      boutonDemarrer.disabled = false;
    }

    return cast;
  }

  corpsAttribution.addEventListener('change', rafraichirEtatDemarrage);

  boutonDemarrer.addEventListener('click', () => {
    const cast = rafraichirEtatDemarrage();

    if (boutonDemarrer.disabled) {
      return;
    }

    const slugCourant = pieceSlug(piece.piece);
    ecrire(cleStockage(`piece:${slugCourant}`), piece);
    ecrire(cleStockage(`cast:${slugCourant}`), cast);

    demarrerProjection(piece, cast);
  });

  importFichier.addEventListener('change', (evenement) => {
    const fichier = evenement.target.files[0];

    if (!fichier) {
      return;
    }

    erreurImport.hidden = true;
    sectionAttribution.hidden = true;

    const lecteur = new FileReader();

    lecteur.onload = () => {
      let donnees;

      try {
        donnees = JSON.parse(lecteur.result);
      } catch (erreur) {
        erreurImport.hidden = false;
        erreurImport.textContent = `Le fichier n'est pas un JSON valide : ${erreur.message}`;
        return;
      }

      const resultat = validerRepet(donnees);

      if (!resultat.valide) {
        erreurImport.hidden = false;
        erreurImport.textContent = resultat.erreur;
        return;
      }

      piece = resultat.piece;
      personnagesCourants = piece.personnages;

      const castSauvegarde = lire(cleStockage(`cast:${pieceSlug(piece.piece)}`)) || {};

      construireTableAttribution(corpsAttribution, personnagesCourants, castSauvegarde);
      sectionAttribution.hidden = false;
      rafraichirEtatDemarrage();
    };

    lecteur.readAsText(fichier, 'utf-8');
  });
})();
</script>
